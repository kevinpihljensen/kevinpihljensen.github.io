<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FPS</title>

  <!--
    M10: split from a single-file build into an ES module tree. The browser
    will NOT load modules from a `file://` URL (cross-origin restriction
    applies to module fetches). To run locally:

        cd <this directory>
        python3 -m http.server 8000
        # open http://localhost:8000/

    Any static file server works. Tested with Python 3's http.server, npx
    serve, and Live Server.
  -->

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    canvas { display: block; outline: none; }

    /* --- OVERLAY (title / pause / gameover / won) --- */
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(0, 0, 0, 0.78);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      cursor: pointer;
    }
    #overlay-title    { font-size: 64px; letter-spacing: 4px; font-weight: 800; margin-bottom: 8px; }
    #overlay-subtitle { font-size: 22px; color: #d4d4d8; margin-bottom: 24px; }
    #overlay-instructions {
      font-size: 14px; color: #a1a1aa;
      max-width: 760px; line-height: 1.6;
      white-space: pre-wrap;
    }

    /* --- TITLE SELECTOR PANEL (shown on the title screen only) --- */
    #title-panel { display: none; flex-direction: column; align-items: center;
      gap: 22px; margin: 6px 0 30px; }
    #overlay.is-title #title-panel { display: flex; }
    .tp-options { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .tp-toggle {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      min-width: 168px; padding: 16px 22px;
      background: rgba(18, 20, 27, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px; cursor: pointer;
      font: inherit; color: #e4e4e7;
      transition: border-color .15s, background .15s, box-shadow .15s, transform .08s;
    }
    .tp-toggle:hover { border-color: rgba(255,255,255,0.32);
      background: rgba(28, 31, 40, 0.95); }
    .tp-toggle:active { transform: translateY(1px); }
    .tp-toggle .tp-name {
      font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      color: #a1a1aa; font-weight: 700;
    }
    .tp-toggle .tp-state {
      font-size: 26px; font-weight: 800; letter-spacing: 1px;
      line-height: 1; padding: 4px 0;
    }
    /* ON = green, OFF = muted red. */
    .tp-toggle.is-on {
      border-color: rgba(74, 222, 128, 0.55);
      box-shadow: 0 0 18px rgba(74, 222, 128, 0.16) inset;
    }
    .tp-toggle.is-on  .tp-state { color: #4ade80; }
    .tp-toggle.is-off .tp-state { color: #ef4444; }
    .tp-toggle.is-off { border-color: rgba(239, 68, 68, 0.4); }

    #btn-play {
      font: inherit; cursor: pointer;
      font-size: 26px; font-weight: 800; letter-spacing: 4px;
      color: #1a1205;
      padding: 16px 64px; border: none; border-radius: 12px;
      background: linear-gradient(180deg, #fde68a 0%, #fbbf24 55%, #f59e0b 100%);
      box-shadow: 0 6px 24px rgba(251, 191, 36, 0.35);
      transition: transform .08s, box-shadow .15s, filter .15s;
    }
    #btn-play:hover { filter: brightness(1.07);
      box-shadow: 0 8px 30px rgba(251, 191, 36, 0.5); }
    #btn-play:active { transform: translateY(2px); }
    .tp-hint { font-size: 12px; color: #71717a; max-width: 620px;
      text-align: center; line-height: 1.5; }

    /* --- HUD ---
       M11: redesigned for legibility. Each HUD widget has a dark backdrop
       with subtle border + glow so it reads against any background color
       (grey arena, sky, enemies). Text uses tabular-nums so numbers don't
       jitter as digits change. */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 4;
      display: none;
      font-variant-numeric: tabular-nums;
    }

    /* Ammo widget — bottom-right. Big readable count, weapon name, mag pips. */
    #hud-ammo-row {
      position: absolute; right: 28px; bottom: 28px;
      text-align: right;
      background: rgba(8, 9, 13, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      padding: 12px 18px 10px;
      min-width: 200px;
    }
    #hud-ammo {
      font-size: 52px; font-weight: 800; line-height: 1;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
      letter-spacing: -1px;
    }
    #hud-ammo .reserve {
      color: #a1a1aa; font-size: 28px; font-weight: 700; margin-left: 4px;
    }
    #hud-ammo .reload-text {
      font-size: 26px; color: #fbbf24; font-weight: 700;
    }
    #hud-weapon {
      font-size: 13px; color: #d4d4d8; margin-top: 6px;
      letter-spacing: 3px; text-transform: uppercase; font-weight: 600;
    }
    /* Mag pips: tiny dots showing rounds remaining in mag */
    #hud-mag-pips {
      display: flex; gap: 3px; margin-top: 8px; justify-content: flex-end;
      flex-wrap: wrap-reverse; max-width: 200px;
    }
    #hud-mag-pips .pip {
      width: 8px; height: 12px; border-radius: 1.5px;
      background: #4ade80;
      box-shadow: 0 0 4px rgba(74, 222, 128, 0.4);
    }
    #hud-mag-pips .pip.empty {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }

    /* Health widget — bottom-left. Framed bar with text overlay. */
    #hud-health-row {
      position: absolute; left: 28px; bottom: 28px;
      width: 280px;
      background: rgba(8, 9, 13, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      padding: 10px 14px 12px;
    }
    #hud-health-label {
      font-size: 11px; color: #a1a1aa;
      letter-spacing: 3px; text-transform: uppercase; font-weight: 600;
      margin-bottom: 6px;
    }
    #hud-health-bar {
      position: relative;
      width: 100%; height: 22px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 3px; overflow: hidden;
    }
    #hud-health-fill {
      height: 100%; width: 100%;
      background: linear-gradient(180deg, #6bf08e 0%, #4ade80 50%, #2db862 100%);
      transition: width 0.15s ease-out, background 0.2s linear;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
    }
    #hud-health-text {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: #ffffff; font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    }

    /* Wave / score — top-left, similar treatment. */
    #hud-wave-row {
      position: absolute; left: 28px; top: 24px;
      background: rgba(8, 9, 13, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      padding: 10px 16px;
      min-width: 180px;
    }
    #hud-wave {
      font-size: 22px; font-weight: 800; letter-spacing: 1px;
      color: #ffffff;
    }
    #hud-wave .sep { color: #71717a; margin: 0 6px; }
    #hud-wave .total { color: #a1a1aa; }
    #hud-score {
      font-size: 14px; color: #d4d4d8; margin-top: 3px;
      letter-spacing: 1px; font-weight: 600;
    }
    #hud-score .label { color: #71717a; margin-right: 6px; font-size: 11px; letter-spacing: 2px; }
    #hud-enemies-left {
      font-size: 12px; color: #fbbf24; margin-top: 3px;
      letter-spacing: 1px; font-weight: 600;
    }
    #hud-break { display: none; font-size: 14px; color: #fbbf24; margin-top: 6px; font-weight: 700; }

    /* Weapon roster (top-right) — shows all four slots, current highlighted. */
    #hud-weapons {
      position: absolute; right: 28px; top: 24px;
      display: flex; gap: 6px;
    }
    #hud-weapons .slot {
      width: 56px; height: 40px;
      background: rgba(8, 9, 13, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 5px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: all 0.15s ease-out;
    }
    #hud-weapons .slot .key {
      font-size: 10px; color: #71717a; font-weight: 700; letter-spacing: 0.5px;
    }
    #hud-weapons .slot .name {
      font-size: 10px; color: #d4d4d8; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px; margin-top: 1px;
    }
    #hud-weapons .slot.locked {
      opacity: 0.35;
    }
    #hud-weapons .slot.locked .name { color: #71717a; }
    #hud-weapons .slot.active {
      background: rgba(251, 191, 36, 0.18);
      border-color: rgba(251, 191, 36, 0.7);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
    }
    #hud-weapons .slot.active .key { color: #fbbf24; }
    #hud-weapons .slot.active .name { color: #fde68a; }

    /* --- CROSSHAIR ---
       M11: bigger, with dark outline so it stays visible against any background.
       Four ticks around a center dot, like classic FPS reticles. */
    #crosshair {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 28px; height: 28px;
      pointer-events: none; z-index: 5;
      display: none;
    }
    /* Center dot */
    #crosshair::before {
      content: ''; position: absolute;
      left: 50%; top: 50%;
      width: 3px; height: 3px;
      background: #ffffff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.85);
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }
    /* Four tick marks via child divs (after pseudo-element used elsewhere) */
    .ch-tick {
      position: absolute;
      background: #ffffff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.85);
    }
    .ch-tick.top    { left: 50%; top: 0;    width: 2px; height: 7px; transform: translateX(-50%); }
    .ch-tick.bottom { left: 50%; bottom: 0; width: 2px; height: 7px; transform: translateX(-50%); }
    .ch-tick.left   { top: 50%; left: 0;    width: 7px; height: 2px; transform: translateY(-50%); }
    .ch-tick.right  { top: 50%; right: 0;   width: 7px; height: 2px; transform: translateY(-50%); }

    /* --- SPEED INDICATOR (bhop) ---
       M11: shows current horizontal speed. Strafe-jumping needs feedback —
       you can't tune your timing without seeing the number go up. */
    #hud-speed {
      position: absolute; left: 50%; bottom: 110px;
      transform: translateX(-50%);
      font-size: 18px; color: rgba(255,255,255,0.55);
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      letter-spacing: 1px;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    #hud-speed.fast { color: #fbbf24; }
    #hud-speed.faster { color: #fb923c; text-shadow: 0 0 8px rgba(251, 146, 60, 0.6), 0 1px 3px rgba(0,0,0,0.8); }
    #hud-speed.fastest { color: #ef4444; text-shadow: 0 0 12px rgba(239, 68, 68, 0.7), 0 1px 3px rgba(0,0,0,0.8); }

    /* Bunny-hop state badge — only shown when bhop is OFF, so the player
       can always confirm the mode (it defaults ON / hidden). */
    #hud-bhop {
      position: absolute; left: 50%; bottom: 86px;
      transform: translateX(-50%);
      font-size: 12px; font-weight: 800; letter-spacing: 2px;
      color: #fca5a5;
      background: rgba(127, 29, 29, 0.55);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 4px; padding: 3px 10px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      pointer-events: none; display: none;
    }

    /* --- HIT MARKER --- */
    #hit-marker {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 24px; height: 24px;
      pointer-events: none; z-index: 6;
      display: none;
    }
    /* Red X for body hits */
    #hit-marker-x { position: relative; width: 100%; height: 100%; }
    #hit-marker-x::before, #hit-marker-x::after {
      content: ''; position: absolute;
      left: 50%; top: 50%;
      width: 22px; height: 3px;
      background: #ef4444;
      transform-origin: center;
    }
    #hit-marker-x::before { transform: translate(-50%, -50%) rotate( 45deg); }
    #hit-marker-x::after  { transform: translate(-50%, -50%) rotate(-45deg); }
    /* Gold + for headshots — distinct shape and color */
    #hit-marker-plus { position: relative; width: 100%; height: 100%; display: none; }
    #hit-marker-plus::before, #hit-marker-plus::after {
      content: ''; position: absolute;
      left: 50%; top: 50%;
      background: #fbbf24;
      box-shadow: 0 0 6px rgba(251, 191, 36, 0.7);
      transform-origin: center;
    }
    #hit-marker-plus::before { width: 26px; height: 3px; transform: translate(-50%, -50%); }
    #hit-marker-plus::after  { width: 3px; height: 26px; transform: translate(-50%, -50%); }

    /* --- DAMAGE FLASH (red vignette pulse) --- */
    #damage-flash {
      position: fixed; inset: 0; pointer-events: none; z-index: 3;
      background: radial-gradient(circle, transparent 30%, rgba(239,68,68,0.55) 100%);
      opacity: 0; transition: opacity 0.08s linear;
    }

    /* --- DAMAGE INDICATOR (arrow rotated toward damage source) --- */
    #damage-indicator {
      position: fixed; left: 50%; top: 50%;
      width: 0; height: 0;
      pointer-events: none; z-index: 5;
      opacity: 0;
      transform: translate(-50%, -50%) rotate(0deg);
    }
    /* CSS triangle. Its tip points along +X in the indicator's local frame;
       when the indicator group is rotated by the screen-CW source angle, the
       tip points toward the damage source. */
    #damage-indicator::before {
      content: '';
      position: absolute;
      left: 60px; top: 0;
      transform: translate(-50%, -50%);
      width: 0; height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 24px solid rgba(239, 68, 68, 0.85);
      filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.6));
    }

    /* --- SCOPE OVERLAY (sniper ADS) ---
       Radial gradient that's transparent inside `min(45vh,45vw)` and black
       outside, plus thin red crosshair lines through center. */
    #scope-overlay {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 6;
      opacity: 0;
      transition: opacity 0.06s linear;
    }
    #scope-overlay .lens {
      position: absolute; inset: 0;
      background: radial-gradient(
        circle at center,
        transparent 0,
        transparent calc(min(45vh, 45vw) - 2px),
        #000 calc(min(45vh, 45vw)),
        #000 100%
      );
    }
    #scope-overlay .reticle-h,
    #scope-overlay .reticle-v {
      position: absolute;
      background: rgba(239, 68, 68, 0.6);
    }
    #scope-overlay .reticle-h { left: 0; right: 0; top: 50%; height: 1px; }
    #scope-overlay .reticle-v { top: 0; bottom: 0; left: 50%; width: 1px; }
    #scope-overlay .reticle-dot {
      position: absolute; left: 50%; top: 50%;
      width: 4px; height: 4px;
      background: rgba(239, 68, 68, 0.9);
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    /* --- TOAST --- */
    #toast {
      position: fixed; left: 50%; top: 18%;
      transform: translate(-50%, 0);
      font-size: 28px; font-weight: 700; letter-spacing: 1px;
      color: #fafafa; text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      opacity: 0; transition: opacity 0.2s linear;
      pointer-events: none; z-index: 7;
      text-align: center;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="overlay">
    <div id="overlay-title">FPS</div>
    <div id="overlay-subtitle">Click to play</div>

    <div id="title-panel">
      <div class="tp-options">
        <button class="tp-toggle" id="btn-bhop" type="button">
          <span class="tp-name">Bunny&nbsp;Hop</span>
          <span class="tp-state">ON</span>
        </button>
        <button class="tp-toggle" id="btn-maptest" type="button">
          <span class="tp-name">Map&nbsp;Test</span>
          <span class="tp-state">OFF</span>
        </button>
      </div>
      <button id="btn-play" type="button">▶&nbsp;&nbsp;PLAY</button>
      <div class="tp-hint">Bunny Hop: build speed by chaining jumps &nbsp;•&nbsp; Map Test: free roam, no enemies</div>
    </div>

    <div id="overlay-instructions"></div>
  </div>

  <div id="hud">
    <div id="hud-wave-row">
      <div id="hud-wave">Wave <span class="current">1</span><span class="sep">/</span><span class="total">10</span></div>
      <div id="hud-score"><span class="label">SCORE</span><span class="value">0</span></div>
      <div id="hud-enemies-left"></div>
      <div id="hud-break"></div>
    </div>
    <div id="hud-weapons">
      <div class="slot" data-weapon="pistol"><div class="key">1</div><div class="name">PIST</div></div>
      <div class="slot locked" data-weapon="shotgun"><div class="key">2</div><div class="name">SHTG</div></div>
      <div class="slot locked" data-weapon="smg"><div class="key">3</div><div class="name">SMG</div></div>
      <div class="slot locked" data-weapon="sniper"><div class="key">4</div><div class="name">SNIP</div></div>
      <div class="slot locked" data-weapon="saw"><div class="key">5</div><div class="name">SAW</div></div>
      <div class="slot" data-weapon="knife"><div class="key">6</div><div class="name">KNIFE</div></div>
    </div>
    <div id="hud-health-row">
      <div id="hud-health-label">HEALTH</div>
      <div id="hud-health-bar">
        <div id="hud-health-fill"></div>
        <div id="hud-health-text">100 / 100</div>
      </div>
    </div>
    <div id="hud-ammo-row">
      <div id="hud-ammo"><span class="mag">12</span><span class="reserve"> / 96</span></div>
      <div id="hud-weapon">Pistol</div>
      <div id="hud-mag-pips"></div>
    </div>
    <div id="hud-speed">0</div>
    <div id="hud-bhop">BUNNY HOP: OFF</div>
  </div>

  <div id="crosshair">
    <div class="ch-tick top"></div>
    <div class="ch-tick bottom"></div>
    <div class="ch-tick left"></div>
    <div class="ch-tick right"></div>
  </div>

  <div id="hit-marker">
    <div id="hit-marker-x"></div>
    <div id="hit-marker-plus"></div>
  </div>

  <div id="damage-flash"></div>
  <div id="damage-indicator"></div>

  <div id="scope-overlay">
    <div class="lens"></div>
    <div class="reticle-h"></div>
    <div class="reticle-v"></div>
    <div class="reticle-dot"></div>
  </div>

  <div id="toast"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
